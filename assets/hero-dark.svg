<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 380" role="img" aria-labelledby="t d"><title id="t">Confidence is a shadow</title><desc id="d">A state vector h projected onto an axis. The projection is what confidence reads; the dashed remainder is the hidden part where errors live. Schematic, not data.</desc><rect width="880" height="380" rx="14" fill="#11140D"/><text x="40" y="54" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="22" letter-spacing="3" fill="#A3A890">ELLISCHMENT</text><text x="40" y="160" font-family="Georgia, 'Times New Roman', serif" font-size="58" fill="#ECE9D8">Confidence</text><text x="40" y="228" font-family="Georgia, 'Times New Roman', serif" font-size="58" font-style="italic" fill="#ECE9D8">is a shadow.</text><text x="40" y="292" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="27" fill="#A3A890">The error lives in the part</text><text x="40" y="326" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="27" fill="#A3A890">that does not project.</text><line x1="410" y1="290" x2="850" y2="290" stroke="#ECE9D8" stroke-width="2.5"/><line x1="488" y1="284" x2="488" y2="296" stroke="#A3A890" stroke-width="1.5"/><line x1="536" y1="284" x2="536" y2="296" stroke="#A3A890" stroke-width="1.5"/><line x1="584" y1="284" x2="584" y2="296" stroke="#A3A890" stroke-width="1.5"/><line x1="632" y1="284" x2="632" y2="296" stroke="#A3A890" stroke-width="1.5"/><line x1="680" y1="284" x2="680" y2="296" stroke="#A3A890" stroke-width="1.5"/><line x1="728" y1="284" x2="728" y2="296" stroke="#A3A890" stroke-width="1.5"/><line x1="776" y1="284" x2="776" y2="296" stroke="#A3A890" stroke-width="1.5"/><line x1="824" y1="284" x2="824" y2="296" stroke="#A3A890" stroke-width="1.5"/><line x1="680" y1="120" x2="680" y2="290" stroke="#E3A64B" stroke-width="4" stroke-dasharray="2 9" stroke-linecap="round"/><path d="M664 290 L664 274 L680 274" fill="none" stroke="#A3A890" stroke-width="2"/><line x1="440" y1="290" x2="680" y2="290" stroke="#86AEDC" stroke-width="7" stroke-linecap="round"/><line x1="440" y1="290" x2="677.6" y2="121.7" stroke="#ECE9D8" stroke-width="4" stroke-linecap="round"/><path d="M665.3 123.2 L680 120 L672.1 132.8" fill="none" stroke="#ECE9D8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="440" cy="290" r="5" fill="#ECE9D8"/><text x="694" y="128" font-family="Georgia, 'Times New Roman', serif" font-size="32" font-style="italic" fill="#ECE9D8">h</text><text x="698" y="213" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="26" fill="#E3A64B">hidden part</text><text x="450" y="340" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="26" fill="#86AEDC">what confidence reads</text></svg>