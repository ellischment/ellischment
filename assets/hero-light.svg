<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 380" role="img" aria-labelledby="t d"><title id="t">Confidence is a shadow</title><desc id="d">A state vector h projected onto an axis. The projection is what confidence reads; the dashed remainder is the hidden part where errors live. Schematic, not data.</desc><rect width="880" height="380" rx="14" fill="#F4F1E6"/><text x="40" y="54" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="22" letter-spacing="3" fill="#4F5642">ELLISCHMENT</text><text x="40" y="160" font-family="Georgia, 'Times New Roman', serif" font-size="58" fill="#232B17">Confidence</text><text x="40" y="228" font-family="Georgia, 'Times New Roman', serif" font-size="58" font-style="italic" fill="#232B17">is a shadow.</text><text x="40" y="292" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="27" fill="#4F5642">The error lives in the part</text><text x="40" y="326" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="27" fill="#4F5642">that does not project.</text><line x1="410" y1="290" x2="850" y2="290" stroke="#232B17" stroke-width="2.5"/><line x1="488" y1="284" x2="488" y2="296" stroke="#4F5642" stroke-width="1.5"/><line x1="536" y1="284" x2="536" y2="296" stroke="#4F5642" stroke-width="1.5"/><line x1="584" y1="284" x2="584" y2="296" stroke="#4F5642" stroke-width="1.5"/><line x1="632" y1="284" x2="632" y2="296" stroke="#4F5642" stroke-width="1.5"/><line x1="680" y1="284" x2="680" y2="296" stroke="#4F5642" stroke-width="1.5"/><line x1="728" y1="284" x2="728" y2="296" stroke="#4F5642" stroke-width="1.5"/><line x1="776" y1="284" x2="776" y2="296" stroke="#4F5642" stroke-width="1.5"/><line x1="824" y1="284" x2="824" y2="296" stroke="#4F5642" stroke-width="1.5"/><line x1="680" y1="120" x2="680" y2="290" stroke="#9A5C0E" stroke-width="4" stroke-dasharray="2 9" stroke-linecap="round"/><path d="M664 290 L664 274 L680 274" fill="none" stroke="#4F5642" stroke-width="2"/><line x1="440" y1="290" x2="680" y2="290" stroke="#2A5F8F" stroke-width="7" stroke-linecap="round"/><line x1="440" y1="290" x2="677.6" y2="121.7" stroke="#232B17" stroke-width="4" stroke-linecap="round"/><path d="M665.3 123.2 L680 120 L672.1 132.8" fill="none" stroke="#232B17" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="440" cy="290" r="5" fill="#232B17"/><text x="694" y="128" font-family="Georgia, 'Times New Roman', serif" font-size="32" font-style="italic" fill="#232B17">h</text><text x="698" y="213" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="26" fill="#9A5C0E">hidden part</text><text x="450" y="340" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="26" fill="#2A5F8F">what confidence reads</text></svg>